packages:
  - packages/**
  - apps/**
  - '!**/test/**'
  - website

# Skip the packageManager-version check entirely: pnpm is pinned by corepack
# (CI runs `corepack prepare pnpm@12.2.1 --activate`), so a version mismatch is
# handled there and must not fail the command here.
# NOTE: this is NOT about the lockfile shape. Keeping pnpm-lock.yaml a single
# document is sharedWorkspaceLockfile, which is on by default in pnpm 12.
pmOnFail: ignore

# minimumReleaseAgeExcludePrune drops any exclusion the freshly written lockfile
# no longer resolves, so an entry here survives only while it is still needed:
# add a pinned exemption when a specific release must bypass the 24h
# minimumReleaseAge window, and pnpm removes it again once that version is gone.
minimumReleaseAgeExcludePrune: true

allowBuilds:
  '@biomejs/biome': false
  '@parcel/watcher': false
  '@swc/core': false
  '@tailwindcss/oxide': false
  core-js: false
  core-js-bundle: false
  core-js-pure: false
  esbuild: false
  fsevents: false
